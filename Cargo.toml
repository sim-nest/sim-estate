[workspace]
resolver = "3"
members = ["crates/sim-estate-core", "crates/sim-estate-project", "crates/sim-lib-estate-book", "crates/sim-lib-estate", "crates/sim-lib-estate-serve", "crates/sim-site-estate-model", "crates/sim-site-estate-command", "crates/sim-site-estate-ansible", "xtask"]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-estate"
homepage = "https://github.com/sim-nest/sim-estate"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
sim-lib-exec = "0.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
